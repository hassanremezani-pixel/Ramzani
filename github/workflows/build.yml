name: Build mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: unzip -q src.zip -d mod
      - run: |
          wget -q https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q gradle-4.10.3-bin.zip
          cd mod
          ../gradle-4.10.3/bin/gradle setupCiWorkspace build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: mod/build/libs/*.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: mod/build/libs/irantech-1.0.jar
